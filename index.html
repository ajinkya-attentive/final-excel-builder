<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attentive Studios</title>
<style>
:root{
--bg:#f3f4f6; --bar:#ffffff; --ink:#1b1f24; --muted:#5d6670; --line:#e1e4e8;
--accent:#1f4e78; --accent-ink:#ffffff; --tab:#eef2f6;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#0f1216; --bar:#171b21; --ink:#e7eaee; --muted:#9aa4ae; --line:#2a3038;
--accent:#5b9bd5; --accent-ink:#0b0f14; --tab:#1d2530;
}
}
:root[data-theme="dark"]{
--bg:#0f1216; --bar:#171b21; --ink:#e7eaee; --muted:#9aa4ae; --line:#2a3038;
--accent:#5b9bd5; --accent-ink:#0b0f14; --tab:#1d2530;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px;background:var(--bar);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:15px;letter-spacing:.01em}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--tab);padding:4px;border-radius:10px;margin-left:auto}
.tab{font:inherit;font-weight:650;border:0;border-radius:8px;padding:8px 16px;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.open{font-size:12.5px;color:var(--accent);text-decoration:none;white-space:nowrap}
.open:hover{text-decoration:underline}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
iframe[hidden]{display:none}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
@media (max-width:560px){.tabs{margin-left:0;width:100%}.tab{flex:1;padding:8px 6px}.open{display:none}}
</style>
</head>
<body>
<div class="bar">
<div class="brand">Attentive Studios<small>Takeoff tools</small></div>
<div class="tabs" role="tablist" aria-label="Studios">
<button class="tab" role="tab" id="t-earthwork" data-app="earthwork" aria-controls="f-earthwork">Earthwork Studio</button>
<button class="tab" role="tab" id="t-excel" data-app="excel" aria-controls="f-excel">Final Excel Builder</button>
</div>
<a class="open" id="openNew" href="earthwork-studio.html" target="_blank" rel="noopener">Open in new tab ↗</a>
</div>
<main>
<div class="loading" id="loading">Loading…</div>
<!-- Each tool is its own file in this repo. Edit earthwork-studio.html or final-excel-builder.html and this page updates. -->
<iframe id="f-earthwork" title="Earthwork Studio" data-src="earthwork-studio.html" hidden></iframe>
<iframe id="f-excel" title="Final Excel Builder" data-src="final-excel-builder.html" hidden></iframe>
</main>
<script>
const APPS = { earthwork: "f-earthwork", excel: "f-excel" };
function show(app){
if (!APPS[app]) app = "earthwork";
document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.app === app)));
for (const [k, id] of Object.entries(APPS)){
const f = document.getElementById(id);
if (k === app){
if (!f.src){ document.getElementById("loading").hidden = false; f.addEventListener("load", () => { document.getElementById("loading").hidden = true; }, { once: true }); f.src = f.dataset.src; }
else document.getElementById("loading").hidden = true;
f.hidden = false;
} else f.hidden = true;
}
document.getElementById("openNew").href = document.getElementById(APPS[app]).dataset.src;
if (location.hash.slice(1) !== app) history.replaceState(null, "", "#" + app);
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => show(t.dataset.app)));
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
</body>
</html>
