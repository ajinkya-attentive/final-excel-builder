<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Excel Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>window.ExcelJS || document.write('<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"><\/script>')</script>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1b1f24; --muted:#5d6670; --line:#e1e4e8;
  --accent:#1f4e78; --accent-ink:#ffffff; --soft:#eef3f8;
  --ok:#1a7f37; --ok-bg:#e6f4ea; --warn:#9a6700; --warn-bg:#fff4d6; --bad:#b42318; --bad-bg:#fde8e7; --info:#0b5cad; --info-bg:#e5f0fb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216; --card:#171b21; --ink:#e7eaee; --muted:#9aa4ae; --line:#2a3038;
    --accent:#5b9bd5; --accent-ink:#0b0f14; --soft:#1d2530;
    --ok:#5fd17a; --ok-bg:#15301d; --warn:#e3b341; --warn-bg:#33290f; --bad:#ff7b72; --bad-bg:#3a1714; --info:#79b8ff; --info-bg:#132c47;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216; --card:#171b21; --ink:#e7eaee; --muted:#9aa4ae; --line:#2a3038;
  --accent:#5b9bd5; --accent-ink:#0b0f14; --soft:#1d2530;
  --ok:#5fd17a; --ok-bg:#15301d; --warn:#e3b341; --warn-bg:#33290f; --bad:#ff7b72; --bad-bg:#3a1714; --info:#79b8ff; --info-bg:#132c47;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.step-n{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;align-items:center;justify-content:center;margin-right:8px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center}
.drop{display:block;border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;cursor:pointer;color:var(--muted);transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--soft);color:var(--ink)}
.drop.done{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.drop input{display:none}
.fname{font-weight:600;word-break:break-all}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
label.opt{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
button{font:inherit;font-weight:600;border-radius:8px;padding:10px 16px;border:1px solid var(--accent);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:13px}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.msg.info{background:var(--info-bg);color:var(--info)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.sec{margin-top:18px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sec-h h3{margin:0;font-size:16px}
.sec-h .tot{font-weight:700;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:600;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td input{width:96px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;text-align:right}
td input.changed{border-color:var(--warn);background:var(--warn-bg)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)} .b-info{background:var(--info-bg);color:var(--info)}
.note{font-size:11.5px;color:var(--muted);margin-top:3px}
.desc{max-width:280px;color:var(--muted);font-size:12px}
.excluded{font-size:13px;color:var(--muted)}
.hidden{display:none}
body.std-mode .priced, body.std-mode #priceCard, body.std-mode #optExact{display:none}
body:not(.std-mode) .std{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Final Excel Builder</h1>
  <p class="sub">Choose the client, upload the RAW takeoff (plus the PRICING file for All County), then download the FINAL Excel.</p>

  <div class="steps">
    <div class="card">
      <h2><span class="step-n">1</span>Client</h2>
      <select id="client"></select>
      <div class="meta" id="clientHint"></div>
      <label class="opt" id="optExact"><input type="checkbox" id="preferExact"> <span>When the pricing file has an <b>exact</b> name match with a different rate, use the pricing-file rate instead of the client rule.</span></label>
    </div>
    <div class="card">
      <h2><span class="step-n">2</span>RAW Excel</h2>
      <label class="drop" id="dropRaw"><input type="file" id="fileRaw" accept=".xlsx,.xlsm"><div class="lbl">Click or drop RAW_EXCEL.xlsx</div></label>
    </div>
    <div class="card" id="priceCard">
      <h2><span class="step-n">3</span>PRICING Excel</h2>
      <label class="drop" id="dropPrice"><input type="file" id="filePrice" accept=".xlsx,.xlsm"><div class="lbl">Click or drop PRICING_EXCEL.xlsx</div></label>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="btnBuild" disabled>Prepare Final Excel</button>
    <button class="ghost" id="btnDownload" disabled>Download Final Excel</button>
  </div>
  <div id="messages"></div>

  <div id="result" class="hidden">
    <div class="kpis">
      <div class="card kpi priced"><div class="v" id="kTotal">$0.00</div><div class="l">Grand total</div></div>
      <div class="card kpi"><div class="v" id="kLines">0</div><div class="l">Line items</div></div>
      <div class="card kpi priced"><div class="v" id="kReview">0</div><div class="l">Need review</div></div>
      <div class="card kpi priced"><div class="v" id="kZero">0</div><div class="l">Priced at $0</div></div>
      <div class="card kpi std"><div class="v" id="kSheets">0</div><div class="l">Sheets</div></div>
    </div>
    <div id="sections"></div>
    <p class="excluded" id="excluded"></p>
  </div>
</div>

<script id="engine">
/* ==================== CLIENT PROFILES ====================
   Each client says which RAW sheets go into the FINAL, in what order,
   how the trade sheet looks, and how each item is priced.
   rules: RAW item (suffix like _0.5' removed) -> pricing item name, or {rate:0,note} */
const CLIENTS = {
  "ALL_COUNTY": {
    name: "All County Excavation and Turf",
    needsPricing: true,
    sections: [
      { raw: "Demolition", code: 1, title: "SITE DEMOLITION", sheet: "SITE DEMOLITION", sheetTitle: "SITE DEMOLITION",
        headers: ["S NO .", "Features Name", "Measure Quantity", "Unit", "Rate $", "Pricing $"], pricing: "lookup",
        rules: {
          "ASPHALT PAVEMENT SECTION REMOVAL & DISPOSAL": "ASPHALT PAVEMENT SECTION REMOVAL & DISPOSAL",
          "CLEARING AND GRUBBING": "CLEARING AND GRUBBING",
          "CONCRETE PAVEMENT REMOVAL & DISPOSAL": "CONCRETE PAVEMENT REMOVAL & DISPOSAL",
          "EX STROM PIPE TO BE REMOVED & DISPOSED": "EX STROM PIPE TO BE REMOVED & DISPOSED",
          "REMOVE & DISPOSE 8\" CONCRETE CURB": "REMOVE AND DISPOSE EXISTING CURB",
          "REMOVE & DISPOSE EXISTING BACKFLOW PREVENTER": "REMOVE & DISPOSE EXISTING BACKFLOW PREVENTER",
          "REMOVE & DISPOSE EXISTING CONCRETE WALL": "REMOVE & DISPOSE EXISTING CONCRETE WALL",
          "REMOVE & DISPOSE EXISTING ELECTRIC LINE": "REMOVE AND DISPOSE EXISTING ELECTRICAL UTILITY",
          "REMOVE & DISPOSE EXISTING FIBER OPTIC CABLE": { rate: 0, note: "No fiber-optic item in pricing file" },
          "REMOVE & DISPOSE EXISTING HEADER CURB": "REMOVE AND DISPOSE EXISTING CURB",
          "REMOVE & DISPOSE EXISTING METER AND SERVICE": "REMOVE & DISPOSE EXISTING METER AND SERVICE",
          "REMOVE & DISPOSE EXISTING POLE": "REMOVE AND DISPOSE EXISTING LIGHT POLES",
          "REMOVE & DISPOSE EXISTING TREE": "REMOVE AND DISPOSE TREE/PALM",
          "REMOVE & DISPOSE EXISTING TYPE D CURB": "REMOVE AND DISPOSE EXISTING CURB",
          "REMOVE & DISPOSE EXISTING TYPE F CURB": "REMOVE AND DISPOSE EXISTING CURB",
          "REMOVE & DISPOSE EXISTING UTILITY BOX": "REMOVE AND DISPOSE EXISTING ELECTRICAL UTILITY",
          "REMOVE AND DISPOSE OF BUILDING STRUCTURE": "REMOVE AND DISPOSE OF BUILDING STRUCTURE",
          "SAWCUT": "SAWCUT",
          "STRUCTURAL REMOVAL & DISPOSAL": { rate: 0, note: "All County final prices this at $0", desc: "N/A" }
        } },
      { raw: "Paving", code: 6, title: "SUBCONTRACTOR_STRIPING & SIGNAGE", sheet: "SUBCONTRACTOR_STRIPING & SIGNAG", sheetTitle: "STRIPING & SIGNAGE",
        headers: ["Sr. no ", "Features Name", "Measure Quantity", "Unit", "Unit Price", "Sub Total"], pricing: "subcontractor" }
    ]
  },
  /* Standard: every RAW sheet becomes one sheet with Sr. No. / Features Name / Measure Quantity / Unit. No pricing file. */
  "STANDARD": {
    name: "Standard Excel (other clients)",
    needsPricing: false,
    standard: true,
    headers: ["Sr. No.", "Features Name", "Measure Quantity", "Unit"]
  }
};

const UNIT_MAP = { sqft: "SF", sf: "SF", ft: "LF", lf: "LF", count: "EA", ea: "EA", each: "EA", cuyd: "CY", cy: "CY", sqyd: "SY", sy: "SY", ton: "TON", ls: "LS" };
const STOP = new Set(["REMOVE","REMOVED","REMOVAL","DISPOSE","DISPOSED","DISPOSAL","AND","&","EXISTING","EX","OF","TO","BE","THE","A"]);

function cellVal(v){
  if (v == null) return null;
  if (typeof v === "object"){
    if (v.richText) return v.richText.map(t => t.text).join("");
    if ("result" in v) return v.result;
    if (v.text) return v.text;
    if (v instanceof Date) return v;
  }
  return v;
}
function toNum(v){ v = cellVal(v); if (v == null || v === "") return null; const n = typeof v === "number" ? v : parseFloat(String(v).replace(/[$,]/g, "")); return isNaN(n) ? null : n; }
function clean(s){ return String(s ?? "").replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, " ").trim().toUpperCase(); }
function baseName(s){ return clean(s).replace(/_\s*\d+(\.\d+)?\s*'?\s*$/, "").trim(); }   // drops _0.5' / _0.33'
function andKey(s){ return baseName(s).replace(/&/g, " AND ").replace(/\s+/g, " ").trim(); }
function tokens(s){ return andKey(s).replace(/[^A-Z0-9"' /-]/g, " ").split(/[\s/]+/).filter(t => t && !STOP.has(t)); }
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }

function sheetRows(ws){
  const rows = [];
  ws.eachRow({ includeEmpty: false }, (row, r) => {
    const arr = []; row.eachCell({ includeEmpty: true }, (c, col) => { arr[col - 1] = cellVal(c.value); });
    rows.push({ r, arr });
  });
  return rows;
}

function parseRaw(wb){
  const out = {};
  wb.eachSheet(ws => {
    const rows = sheetRows(ws); if (!rows.length) return;
    const head = rows[0].arr.map(h => clean(h));
    const ix = n => head.findIndex(h => h === n);
    const iItem = ix("ITEM"), iQty = ix("MEASURED QUANTITY"), iUnit = ix("UNIT"), iDesc = ix("DESCRIPTION");
    if (iItem < 0 || iQty < 0) return;
    out[ws.name] = rows.slice(1).map(({ arr }) => ({
      item: String(arr[iItem] ?? "").trim(),
      qty: toNum(arr[iQty]),
      unitRaw: String(arr[iUnit] ?? "").trim(),
      desc: String(arr[iDesc] ?? "").replace(/\s+$/g, "").replace(/^\s+/g, "")
    })).filter(x => x.item);
  });
  return out;
}

function parsePricing(wb){
  const list = [];
  wb.eachSheet(ws => {
    sheetRows(ws).forEach(({ r, arr }) => {
      const name = arr[0], price = toNum(arr[1]);
      if (name == null || String(name).trim() === "" || price == null) return;
      list.push({ name: String(name).trim(), price, sheet: ws.name, row: r });
    });
  });
  return list;
}

function findPricing(list, name){
  const k = andKey(name);
  return list.find(p => andKey(p.name) === k) || null;
}
function keywordMatch(list, item){
  const t = new Set(tokens(item)); if (!t.size) return null;
  let best = null;
  for (const p of list){
    const pt = new Set(tokens(p.name)); if (!pt.size) continue;
    let inter = 0; pt.forEach(x => { if (t.has(x)) inter++; });
    const score = inter / (t.size + pt.size - inter);
    if (inter && (!best || score > best.score)) best = { p, score };
  }
  return best && best.score >= 0.5 ? best : null;
}

function priceLine(sec, item, pricing, preferExact){
  if (sec.pricing === "subcontractor") return { rate: 0, status: "sub", label: "Subcontractor quote", note: "Enter the sub's unit price" };
  const key = baseName(item);
  const exact = findPricing(pricing, item);
  const rule = sec.rules && Object.entries(sec.rules).find(([k]) => baseName(k) === key);
  if (rule){
    const target = rule[1];
    let res;
    if (typeof target === "string"){
      const p = findPricing(pricing, target);
      res = p ? { rate: p.price, status: "ok", label: "Client rule", note: `${p.sheet}: ${p.name}`, src: p }
              : { rate: 0, status: "bad", label: "Rule item missing", note: `"${target}" not found in pricing file` };
    } else { res = { rate: target.rate, status: "ok", label: "Client rule", note: target.note }; if (target.desc) res.desc = target.desc; }
    if (exact && Math.abs(exact.price - res.rate) > 1e-9){
      if (preferExact) return { rate: exact.price, status: "warn", label: "Exact match (override)", note: `${exact.sheet}: ${exact.name}. Client rule gave $${res.rate.toFixed(2)}`, ...(res.desc ? { desc: res.desc } : {}) };
      res.status = "warn"; res.label = "Client rule · conflict";
      res.note = (res.note ? res.note + " · " : "") + `${exact.sheet} also lists exact item at $${exact.price.toFixed(2)}`;
    }
    return res;
  }
  if (exact) return { rate: exact.price, status: "ok", label: "Exact match", note: `${exact.sheet}: ${exact.name}` };
  const kw = keywordMatch(pricing, item);
  if (kw) return { rate: kw.p.price, status: "warn", label: "Keyword match · check", note: `${kw.p.sheet}: ${kw.p.name}` };
  return { rate: 0, status: "bad", label: "Not in pricing", note: "No matching item. $0 used" };
}

function unitOf(u){ return UNIT_MAP[String(u).toLowerCase()] || String(u).toUpperCase(); }
function safeSheetName(s, used){
  let n = String(s).replace(/[\\\/\?\*\[\]:]/g, " ").trim().slice(0, 31) || "Sheet"; let k = n, i = 2;
  while (used.has(k.toLowerCase())) k = n.slice(0, 28) + " " + i++;
  used.add(k.toLowerCase()); return k;
}

function buildModel(raw, pricing, clientKey, preferExact){
  const client = CLIENTS[clientKey];
  if (client.standard){
    const used = new Set();
    const sections = Object.entries(raw).map(([name, rows], si) => ({
      raw: name, index: si + 1, title: name.toUpperCase(), sheet: safeSheetName(name, used), sheetTitle: name.toUpperCase(),
      headers: client.headers,
      lines: rows.map((r, i) => ({ n: i + 1, item: r.item, qty: r.qty ?? 0, unit: unitOf(r.unitRaw) }))
    }));
    return { client, sections, excluded: [], missing: [], standard: true };
  }
  const missing = [];
  const sections = client.sections.map((sec, si) => {
    const rows = raw[sec.raw];
    if (!rows) { missing.push(sec.raw); return null; }
    const lines = rows.map((r, i) => {
      const pr = priceLine(sec, r.item, pricing, preferExact);
      const desc = r.desc && r.desc.trim() ? r.desc.trim() : "N/A";
      return { n: i + 1, sub: round2(si + 1 + (i + 1) / 100), item: r.item, desc, qty: r.qty ?? 0, unit: UNIT_MAP[r.unitRaw.toLowerCase()] || r.unitRaw.toUpperCase(), ...pr };
    });
    return { ...sec, index: si + 1, lines };
  }).filter(Boolean);
  const used = new Set(client.sections.map(s => s.raw));
  const excluded = Object.keys(raw).filter(k => !used.has(k));
  return { client, sections, excluded, missing };
}

/* ---------- styles (match the uploaded FINAL) ---------- */
const THIN = { style: "thin", color: { argb: "FF000000" } };
const BORDER = { top: THIN, left: THIN, bottom: THIN, right: THIN };
const MONEY = '"$"#,##0.00', QTY = "#,##0.00";
const fill = argb => ({ type: "pattern", pattern: "solid", fgColor: { argb } });
const CENTER = { horizontal: "center", vertical: "middle", wrapText: false };
function qtyFmt(q){ return Number.isInteger(q) ? "General" : QTY; }

function writeStandard(ExcelJS, model){
  const wb = new ExcelJS.Workbook();
  wb.creator = "Final Excel Builder";
  for (const sec of model.sections){
    const ws = wb.addWorksheet(sec.sheet);
    ws.columns = [{ width: 10 }, { width: 69.13 }, { width: 18 }, { width: 10 }];
    const t = ws.getCell("B1"); t.value = sec.sheetTitle; t.font = { name: "Calibri", size: 15, bold: true }; t.alignment = { horizontal: "center", wrapText: true }; t.border = BORDER;
    sec.headers.forEach((x, i) => { const c = ws.getRow(2).getCell(i + 1); c.value = x; c.font = { name: "Calibri", size: 12, bold: true }; c.fill = fill("FFD9D9D9"); c.alignment = { horizontal: "center", vertical: "bottom", wrapText: true }; c.border = BORDER; });
    sec.lines.forEach((L, i) => {
      const row = ws.getRow(3 + i);
      row.getCell(1).value = L.n;
      row.getCell(2).value = L.item;
      row.getCell(3).value = L.qty; row.getCell(3).numFmt = qtyFmt(L.qty);
      row.getCell(4).value = L.unit;
      for (let c = 1; c <= 4; c++){ const cc = row.getCell(c); cc.font = { name: "Calibri", size: 11 }; cc.alignment = CENTER; cc.border = BORDER; }
    });
  }
  return { wb, grand: 0 };
}

function writeWorkbook(ExcelJS, model){
  if (model.standard) return writeStandard(ExcelJS, model);
  const wb = new ExcelJS.Workbook();
  wb.creator = "Final Excel Builder";
  const sum = wb.addWorksheet("Summary");
  sum.columns = [{ width: 8 }, { width: 29.13 }, { width: 46.13 }, { width: 47 }, { width: 17 }, { width: 8 }, { width: 13 }, { width: 16 }, { width: 18 }];
  const hdr = ["Item", "Sub Item", "Features Name", "Description", "Measure Quantity", "Unit", "Unit Price", "Sub Total", "Total Amount"];
  const h = sum.getRow(1);
  hdr.forEach((t, i) => { const c = h.getCell(i + 1); c.value = t; c.font = { name: "Arial", bold: true, size: 10 }; c.fill = fill("FF999999"); c.border = BORDER; c.alignment = { horizontal: "center", vertical: "bottom", wrapText: true }; });

  let r = 2, grand = 0;
  for (const sec of model.sections){
    // trade sheet
    const ws = wb.addWorksheet(sec.sheet);
    ws.columns = [{ width: 12.63 }, { width: 69.13 }, { width: 16.88 }, { width: 12.63 }, { width: 12 }, { width: 16.13 }];
    const t = ws.getCell("B1"); t.value = sec.sheetTitle; t.font = { name: "Calibri", size: 15, bold: true }; t.alignment = { horizontal: "center", wrapText: true }; t.border = BORDER;
    sec.headers.forEach((x, i) => { const c = ws.getRow(2).getCell(i + 1); c.value = x; c.font = { name: "Calibri", size: 12, bold: true }; c.alignment = { horizontal: "center", vertical: "bottom", wrapText: true }; c.border = BORDER; });
    let tr = 3, secTotal = 0;
    for (const L of sec.lines){
      const sub = round2(L.qty * L.rate); secTotal += L.qty * L.rate;
      const row = ws.getRow(tr);
      row.getCell(1).value = L.n;
      row.getCell(2).value = L.item;
      row.getCell(3).value = L.qty; row.getCell(3).numFmt = qtyFmt(L.qty);
      row.getCell(4).value = L.unit;
      row.getCell(5).value = L.rate; row.getCell(5).numFmt = MONEY;
      row.getCell(6).value = { formula: `C${tr}*E${tr}`, result: L.qty * L.rate }; row.getCell(6).numFmt = MONEY;
      for (let c = 1; c <= 6; c++){ const cc = row.getCell(c); cc.font = { name: "Calibri", size: 11 }; cc.alignment = CENTER; cc.border = BORDER; }
      tr++;
    }
    const tot = ws.getRow(tr);
    tot.getCell(2).value = "TOTAL";
    tot.getCell(6).value = { formula: `SUM(F3:F${tr - 1})`, result: secTotal }; tot.getCell(6).numFmt = MONEY;
    [2, 6].forEach(c => { tot.getCell(c).font = { name: "Arial", size: 12, bold: true }; tot.getCell(c).alignment = { horizontal: "center", vertical: "middle" }; });
    for (let c = 2; c <= 6; c++) tot.getCell(c).border = BORDER;

    // summary section header
    const first = r + 1, last = r + sec.lines.length;
    const sh = sum.getRow(r);
    sh.getCell(1).value = sec.code;
    sh.getCell(2).value = sec.title;
    sh.getCell(9).value = { formula: `SUM(H${first}:H${last})`, result: secTotal };
    for (let c = 1; c <= 9; c++){ const cc = sh.getCell(c); cc.fill = fill("FFB7B7B7"); cc.border = BORDER; cc.font = { name: "Arial", size: 10, bold: c === 1 || c === 2 || c === 9 }; }
    sh.getCell(1).alignment = { horizontal: "center" }; sh.getCell(2).alignment = { horizontal: "center", wrapText: true }; sh.getCell(9).alignment = { horizontal: "center" };
    sh.getCell(9).numFmt = MONEY; sh.getCell(2).numFmt = "0.00";
    const q = s => "'" + s.replace(/'/g, "''") + "'";
    sec.lines.forEach((L, i) => {
      const rr = r + 1 + i, row = sum.getRow(rr);
      row.getCell(2).value = L.sub; row.getCell(2).numFmt = "0.00";
      row.getCell(3).value = L.item;
      row.getCell(4).value = L.desc;
      row.getCell(5).value = L.qty; row.getCell(5).numFmt = qtyFmt(L.qty);
      row.getCell(6).value = L.unit;
      row.getCell(7).value = { formula: `${q(sec.sheet)}!E${3 + i}`, result: L.rate }; row.getCell(7).numFmt = MONEY;
      row.getCell(8).value = { formula: `E${rr}*G${rr}`, result: L.qty * L.rate }; row.getCell(8).numFmt = MONEY;
      for (let c = 1; c <= 9; c++){ const cc = row.getCell(c); cc.font = { name: "Calibri", size: 11 }; cc.border = BORDER; cc.alignment = { horizontal: "center", vertical: "middle", wrapText: c === 4 }; }
    });
    grand += secTotal;
    r = last + 1;
  }
  return { wb, grand };
}

if (typeof module !== "undefined") module.exports = { CLIENTS, parseRaw, parsePricing, buildModel, writeWorkbook, baseName, andKey };
</script>

<script>
/* ==================== UI ==================== */
const $ = id => document.getElementById(id);
const state = { rawWb: null, priceWb: null, rawName: "", priceName: "", model: null };
const fmt$ = n => "$" + (n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtQ = n => (n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

Object.entries(CLIENTS).forEach(([k, c]) => { const o = document.createElement("option"); o.value = k; o.textContent = c.name; $("client").appendChild(o); });

function msg(html, kind = "info"){ $("messages").insertAdjacentHTML("beforeend", `<div class="msg ${kind}">${html}</div>`); }
function clearMsg(){ $("messages").innerHTML = ""; }

function wireDrop(dropId, inputId, key){
  const drop = $(dropId), input = $(inputId);
  const load = async file => {
    if (!file) return;
    if (!window.ExcelJS){ clearMsg(); msg("The Excel library didn't load. Check your internet connection and reload this page.", "err"); return; }
    try {
      const wb = new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
      state[key + "Wb"] = wb; state[key + "Name"] = file.name;
      const sheets = wb.worksheets.map(w => w.name).join(", ");
      drop.classList.add("done");
      drop.querySelector(".lbl").innerHTML = `<div class="fname">${esc(file.name)}</div><div class="meta">Sheets: ${esc(sheets)}</div>`;
    } catch (e){ clearMsg(); msg(`Couldn't read <b>${esc(file.name)}</b>: ${esc(e.message)}`, "err"); }
    updateReady();
  };
  input.addEventListener("change", e => load(e.target.files[0]));
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => load(e.dataTransfer.files[0]));
}
wireDrop("dropRaw", "fileRaw", "raw");
wireDrop("dropPrice", "filePrice", "price");

const curClient = () => CLIENTS[$("client").value];
function updateReady(){
  const c = curClient();
  $("btnBuild").disabled = !(state.rawWb && (!c.needsPricing || state.priceWb));
}
function onClientChange(){
  const c = curClient();
  document.body.classList.toggle("std-mode", !c.needsPricing);
  $("clientHint").textContent = c.needsPricing
    ? "Needs RAW + PRICING. Output: Summary with prices + one priced sheet per trade."
    : "Needs RAW only. Output: one sheet per RAW tab with Sr. No., Features Name, Measure Quantity, Unit.";
  state.model = null; $("result").classList.add("hidden"); $("btnDownload").disabled = true; clearMsg();
  updateReady();
}

function build(){
  clearMsg();
  const c = curClient();
  const raw = parseRaw(state.rawWb), pricing = c.needsPricing ? parsePricing(state.priceWb) : [];
  if (!Object.keys(raw).length){ msg("No RAW sheets found. Each RAW sheet needs <b>Item</b> and <b>Measured Quantity</b> headers in row 1.", "err"); return; }
  if (c.needsPricing && !pricing.length){ msg("No prices found. The pricing file needs item names in column A and prices in column B.", "err"); return; }
  const model = buildModel(raw, pricing, $("client").value, $("preferExact").checked);
  if (model.missing.length) msg(`RAW file is missing sheet(s) this client needs: <b>${model.missing.map(esc).join(", ")}</b>.`, "warn");
  state.model = model; render(); $("btnDownload").disabled = !model.sections.length;
}

function totals(){
  if (state.model.standard){
    $("kLines").textContent = state.model.sections.reduce((a, s) => a + s.lines.length, 0);
    $("kSheets").textContent = state.model.sections.length; return;
  }
  let g = 0, n = 0, rev = 0, z = 0;
  state.model.sections.forEach(s => s.lines.forEach(L => { g += L.qty * L.rate; n++; if (L.status === "warn" || L.status === "bad") rev++; if (!L.rate) z++; }));
  $("kTotal").textContent = fmt$(g); $("kLines").textContent = n; $("kReview").textContent = rev; $("kZero").textContent = z;
  state.model.sections.forEach((s, si) => { const t = s.lines.reduce((a, L) => a + L.qty * L.rate, 0); const el = $("tot" + si); if (el) el.textContent = fmt$(t); });
}

function renderStandard(m){
  $("sections").innerHTML = m.sections.map((s, si) => `
    <div class="sec">
      <div class="sec-h"><h3>${esc(s.sheetTitle)} <span class="meta">→ sheet "${esc(s.sheet)}" · ${s.lines.length} items</span></h3></div>
      <div class="tbl-wrap"><table style="min-width:520px">
        <thead><tr><th>Sr. No.</th><th>Features Name</th><th class="num">Measure Quantity</th><th>Unit</th></tr></thead>
        <tbody>${s.lines.map((L, li) => `
          <tr><td>${L.n}</td><td>${esc(L.item)}</td>
          <td class="num"><input data-s="${si}" data-l="${li}" data-f="qty" value="${L.qty}" data-orig="${L.qty}" inputmode="decimal"></td>
          <td>${esc(L.unit)}</td></tr>`).join("")}</tbody>
      </table></div>
    </div>`).join("");
  $("excluded").textContent = "";
  document.querySelectorAll("#sections input").forEach(inp => inp.addEventListener("input", e => {
    const { s, l } = e.target.dataset; const v = parseFloat(e.target.value.replace(/,/g, ""));
    state.model.sections[s].lines[l].qty = isNaN(v) ? 0 : v;
    e.target.classList.toggle("changed", e.target.value !== e.target.dataset.orig);
  }));
  totals();
}

function render(){
  const m = state.model; $("result").classList.remove("hidden");
  if (m.standard) return renderStandard(m);
  const B = { ok: "b-ok", warn: "b-warn", bad: "b-bad", sub: "b-info" };
  $("sections").innerHTML = m.sections.map((s, si) => `
    <div class="sec">
      <div class="sec-h"><h3>${s.code}. ${esc(s.title)} <span class="meta">→ sheet "${esc(s.sheet)}" · from RAW "${esc(s.raw)}"</span></h3><div class="tot" id="tot${si}"></div></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Sub</th><th>Features Name</th><th>Description</th><th class="num">Qty</th><th>Unit</th><th class="num">Unit Price</th><th class="num">Sub Total</th><th>Pricing source</th></tr></thead>
        <tbody>${s.lines.map((L, li) => `
          <tr>
            <td>${L.sub.toFixed(2)}</td>
            <td>${esc(L.item)}</td>
            <td class="desc">${esc(L.desc)}</td>
            <td class="num"><input data-s="${si}" data-l="${li}" data-f="qty" value="${L.qty}" data-orig="${L.qty}" inputmode="decimal"></td>
            <td>${esc(L.unit)}</td>
            <td class="num"><input data-s="${si}" data-l="${li}" data-f="rate" value="${L.rate}" data-orig="${L.rate}" inputmode="decimal"></td>
            <td class="num" id="st${si}_${li}">${fmt$(L.qty * L.rate)}</td>
            <td><span class="badge ${B[L.status]}">${esc(L.label)}</span>${L.note ? `<div class="note">${esc(L.note)}</div>` : ""}</td>
          </tr>`).join("")}</tbody>
      </table></div>
    </div>`).join("");
  $("excluded").textContent = m.excluded.length ? `RAW sheets not used for ${m.client.name}: ${m.excluded.join(", ")}.` : "";
  document.querySelectorAll("#sections input").forEach(inp => inp.addEventListener("input", e => {
    const { s, l, f } = e.target.dataset; const v = parseFloat(e.target.value.replace(/[$,]/g, ""));
    const L = state.model.sections[s].lines[l]; L[f] = isNaN(v) ? 0 : v;
    e.target.classList.toggle("changed", String(L[f]) !== e.target.dataset.orig);
    $(`st${s}_${l}`).textContent = fmt$(L.qty * L.rate); totals();
  }));
  totals();
}

async function download(){
  const { wb } = writeWorkbook(ExcelJS, state.model);
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const name = state.model.standard ? "FINAL_EXCEL_STANDARD.xlsx"
    : "FINAL_EXCEL_" + state.model.client.name.replace(/[^A-Za-z0-9]+/g, "_").toUpperCase() + ".xlsx";
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  clearMsg();
  msg(`<b>${esc(name)}</b> is ready. If the download didn't start, <a href="${url}" download="${esc(name)}" target="_blank" rel="noopener">click here to save it</a>.`, "info");
  setTimeout(() => URL.revokeObjectURL(url), 10 * 60 * 1000);
}

$("btnBuild").addEventListener("click", build);
$("btnDownload").addEventListener("click", download);
$("preferExact").addEventListener("change", () => { if (state.model) build(); });
$("client").addEventListener("change", onClientChange);
onClientChange();
</script>
</body>
</html>
